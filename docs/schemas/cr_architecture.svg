xt x="590.0" y="248.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2E3A3F">Silver · Hive</text><text x="590.0" y="266.5" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#56646A">typé, nettoyé, dédoublonné,</text><text x="590.0" y="283.5" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#56646A">sources reliées entre elles</text><rect x="440" y="360" width="300" height="80" rx="8" fill="#FBF1CC" stroke="#B38B12" stroke-width="1.3"/><text x="590.0" y="383.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#5C4506">Gold · Hive</text><text x="590.0" y="401.5" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#7D610C">constellation en étoile,</text><text x="590.0" y="418.5" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#7D610C">format ORC, partitions par année</text><path d="M470,172 L470,223" fill="none" stroke="#56636A" stroke-width="1.6" marker-end="url(#m0)"/><path d="M470,307 L470,358" fill="none" stroke="#56636A" stroke-width="1.6" marker-end="url(#m0)"/><rect x="526.0" y="189" width="178.00000000000003" height="18" rx="4" fill="#FFFFFF"/><text x="615" y="198" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5B676C">Talend : nettoyer, relier</text><rect x="549.52" y="324" width="130.96" height="18" rx="4" fill="#FFFFFF"/><text x="615" y="333" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5B676C">HiveQL : modéliser</text><text x="870" y="285" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#5B676C">via ODBC Hive / Impala</text><rect x="790" y="300" width="170" height="62" rx="8" fill="#ECEDFB" stroke="#5457C4" stroke-width="1.3"/><text x="875.0" y="314.0" font-size="14" font-weight="600" text-anchor="middl