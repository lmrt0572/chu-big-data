<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif"><title>Chaîne de traitements ETL</title><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56636A"/></marker></defs><rect width="980" height="560" fill="#FFFFFF"/><rect x="30" y="30" width="280" height="420" rx="12" fill="#F7E6D6" fill-opacity="0.5" stroke="#A8652C" stroke-width="1.3"/><text x="170" y="55" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#5A3412">Extraction → Bronze</text><rect x="50" y="80" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="100.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B01 · PostgreSQL</text><rect x="50" y="130" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="150.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B02 · Établissements</text><rect x="50" y="180" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="200.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B03 · Hospitalisations</text><rect x="50" y="230" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="250.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B04 · Satisfaction 2019-2020</text><rect x="50" y="280" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="300.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B05 · Décès</text><rect x="50" y="330" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="170.0" y="350.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">B06 · Régions INSEE</text><rect x="350" y="30" width="280" height="420" rx="12" fill="#EEF1F3" fill-opacity="0.5" stroke="#7F8D93" stroke-width="1.3"/><text x="490" y="55" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#2E3A3F">Bronze → Silver</text><rect x="370" y="80" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="100.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S01 · Patients</text><rect x="370" y="130" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="150.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S02 · Professionnels</text><rect x="370" y="180" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="200.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S03 · Consultations</text><rect x="370" y="230" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="250.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S04 · Hospitalisations</text><rect x="370" y="280" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="300.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S05 · Décès</text><rect x="370" y="330" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="350.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S06 · Satisfaction</text><rect x="370" y="380" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="490.0" y="400.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">S07 · Établissements, régions</text><path d="M312,240 L347,240" fill="none" stroke="#56636A" stroke-width="1.6" marker-end="url(#m0)"/><rect x="670" y="30" width="280" height="420" rx="12" fill="#FBF1CC" fill-opacity="0.5" stroke="#B38B12" stroke-width="1.3"/><text x="810" y="55" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#5C4506">Silver → Gold</text><rect x="690" y="80" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="810.0" y="100.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">G01 · Dimensions</text><rect x="690" y="130" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="810.0" y="150.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">G02 · Faits</text><rect x="690" y="180" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#9AA6AA" stroke-width="1.3"/><text x="810.0" y="200.5" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1F2A2D">G03 · Contrôles</text><text x="810.0" y="219.0" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#55626A">volumes, orphelins, rejets</text><path d="M632,240 L667,240" fill="none" stroke="#56636A" stroke-width="1.6" marker-end="url(#m0)"/><rect x="30" y="470" width="920" height="76" rx="8" fill="#F6F7F8" stroke="#9AA6AA" stroke-width="1.3" stroke-dasharray="6 4"/><text x="490.0" y="491.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#3A464B">Un job = un traitement Talend. B alimente Bronze, S alimente Silver, G alimente Gold ;</text><text x="490.0" y="509.5" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#55626A">le numéro donne l&#x27;ordre d&#x27;exécution. Chaque trimestre : tous les B, puis les S, puis les G.</text><text x="490.0" y="526.5" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#55626A">Chaque job écrit dans le journal de chargement ; les lignes rejetées vont dans une table de rejets.</text></svg>